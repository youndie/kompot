[versions]
# The build conventions: where the group, the version, the toolchain, the jvm floor and the
# publication come from. Bumping this changes how every module is built, so it is pinned like any
# other dependency and moved deliberately.
sborka = "0.4.0.111"
# The compiler is not here: kotlin, ksp and the Android Gradle plugin come from `wip`, the catalog the
# sborka release above publishes, so moving the compiler is moving that one number. Compose is the
# exception and stays below — see `jewel`.
ktor = "3.6.0"
dokka = "2.2.0"
kotlinpoet = "2.3.0"
kotlinx-coroutines = "1.11.0"
kotlinxSerializationJson = "1.11.0"
lettuce = "7.6.0.RELEASE"
# Compose stays OURS rather than `wip`'s, and the reason is the jewel entry below: the Compose line
# moves in one commit with material3, jewel and viddik (B-40), and taking it from the shared catalog
# would let a sborka bump move it alone — a build that resolves, compiles, and throws on the first
# frame. The number matches `wip` (1.12.1); keeping it equal is a review item, not an automatism.
compose-multiplatform = "1.12.1"
compose-material3 = "1.12.0-alpha03"
coil3 = "3.6.3"
# 0.6.1 on Central, the first release with youndie/viddik#44 fixed (the plugin no longer adds its
# showroom directory to commonMain with the showroom off), which let :kompot-ds-material-compose drop
# its workaround. Test scope and the studio's run classpath only — nothing published by kompot depends
# on viddik. It was the wip snapshot 0.6.0.40 until this release (B-58).
viddik = "0.6.1"
# The studio's IDE-style shell. The version carries the IntelliJ build it was cut from
# (`0.41.0-262.10968.63`), which is why it cannot be a plain three-number bump: what has to match is
# the Compose line, not the IJ build. 0.41 is the 1.12 line, like `compose-multiplatform` above and
# like viddik 0.6 (0.40 was 1.11). Mixing lines resolves cleanly and then throws NoSuchMethodError on
# the first frame, inside a renderer, so this number moves only together with
# `compose-multiplatform`, `compose-material3` and `viddik` — one commit for all four (B-40).
jewel = "0.41.0-262.10968.63"
# The IntelliJ platform build Jewel was cut against — the suffix of the line above — and the only
# place the icon bundle comes from. The two move together or the chevrons come out magenta.
ijPlatform = "262.10968.63"
# The JetBrains Runtime's own API, and the studio compiles against it for ONE call: the same
# `JBR.isAvailable()` Jewel's DecoratedWindow tests before refusing to open. It arrives transitively
# with Jewel anyway; naming it is what lets code ask the question rather than guess at it from
# `java.vendor` — which on a JBR reads "Oracle Corporation", exactly like the JDK it is not.
jbrApi = "1.9.0"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

ktor-serverCore = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-serverContentNegotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serverStatusPages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-serverTestHost = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
ktor-serializationJson = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-clientCore = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktor-clientCio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }

lettuce = { group = "io.lettuce", name = "lettuce-core", version.ref = "lettuce" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-components-ui-tooling-preview = { module = "org.jetbrains.compose.components:components-ui-tooling-preview", version.ref = "compose-multiplatform" }
# The current home of @Preview. components-ui-tooling-preview above still resolves and its annotation
# is deprecated in favour of this one — the compiler says so by name, which is how this line came to
# exist rather than by reading a migration note.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }

coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil3-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
coil3-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil3" }

# The screenshot tester, published from its own repository (github.com/youndie/viddik) to Maven
# Central under `io.github.youndie.viddik` since 0.4.0. Up to 0.3.3 it was `ru.workinprogress` on our
# Reposilite, and the move renamed the PACKAGES too (`ru.workinprogress.viddik.*` →
# `io.github.youndie.viddik.*`) — which matters beyond imports: the studio reaches viddik and the
# registry its processor generates by class name, as strings the compiler does not check.
viddik-annotations = { module = "io.github.youndie.viddik:viddik-annotations", version.ref = "viddik" }
viddik-testing-core = { module = "io.github.youndie.viddik:viddik-testing-core", version.ref = "viddik" }
viddik-processor = { module = "io.github.youndie.viddik:viddik-processor", version.ref = "viddik" }

# Jewel, the standalone (non-IDE) flavour: the tree, the split panes and the decorated window the
# studio's shell is made of. It pulls Compose Material 2 for its own theming, and the toolkit's
# renderers read material3 — the consumer of this entry excludes the former, per Jewel's own
# instructions, so that two Material generations do not sit in one classpath.
jewel-int-ui-standalone = { module = "org.jetbrains.jewel:jewel-int-ui-standalone", version.ref = "jewel" }
jewel-int-ui-decorated-window = { module = "org.jetbrains.jewel:jewel-int-ui-decorated-window", version.ref = "jewel" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbrApi" }
intellij-icons = { module = "com.jetbrains.intellij.platform:icons", version.ref = "ijPlatform" }

kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

[plugins]
# What fills the javadoc jar. Central takes an empty one and says nothing about it, so without this
# the file every artefact must carry is a file with nothing in it.
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
# Wires viddik's processor onto the right KSP configuration, registers the generated sources and gives
# the viddikRecord/viddikVerify tasks — what :kompot-ds-material-compose used to write by hand.
viddik = { id = "io.github.youndie.viddik", version.ref = "viddik" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
