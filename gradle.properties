kotlin.code.style=official
# The Kotlin daemon's heap. Enough for the build as long as wasm executables are linked one at a time
# (the root build.gradle.kts, B-64): the peak live heap of an uncached full build is about 2 GB then.
# Eight links at once did not fit and failed with "GC overhead limit exceeded".
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# The version, and one number rather than two: the archive tasks take their file name from the
# PROJECT version while the coordinate comes from the publication, so a version set on one of them
# alone ships `kompot-core-jvm-0.27.0.jar` under the coordinate `0.27.0.46` — resolvable, misnamed on
# arrival, and indistinguishable from another release to anything that reads file names. CI passes the
# full number through `-PVERSION`; this is the head of it, so a local `publishToMavenLocal` works
# without extra parameters.
version=0.38.0

# WHAT THE CONVENTIONS READ.
#
# The group belongs to the build rather than to each module. Six modules of the Compose client once
# arrived without one and were published under a group derived from the root project name — a failure
# that surfaced at upload time, as a PUT to the wrong path, after everything had compiled and tested.
# MAVEN CENTRAL, and 0.37.0 rather than 0.36.3 because the coordinate is the event: this is the first
# version somebody can resolve without being told about a repository of ours, and the toolkit's whole
# premise is that the other end is written by a team we have never met.
#
# This property is the entire contract. `io.github.youndie.sborka.publish` reads it and applies the
# plugin that produces the javadoc jar and the detached signature the portal requires for every file —
# neither of which `withSourcesJar()` gives. The credentials are not here and not in this repository's
# secrets: the release is a dispatch of `central.yaml` in sborka, so that a key rotation happens in one
# place instead of in every library that publishes.
#
# THE CONTINUOUS CHANNEL DOES NOT MOVE. A push to main still publishes `<version>.<run>` to the
# Reposilite, and that is what a dogfooding build and the consumer-side reader resolve. What goes to
# Central is a version a person decided on, because Central never rewrites or removes one — the upload
# only stages it, and somebody reads the bundle before pressing Publish.
sborka.central=true

sborka.group=io.github.youndie
sborka.repository=youndie/kompot
sborka.description=A server-driven UI toolkit for Kotlin Multiplatform: the wire, the components, the forms and a Compose client.
sborka.inceptionYear=2026

# 17 for both, and the second number is the point. It used to say 25, which is what the machines here
# run, and that number left the building inside the bytecode: a consumer on 21 resolved the dependency
# without a word of complaint, compiled against it happily, and failed at class loading with
# UnsupportedClassVersionError — a message about a number rather than about kompot, and invisible to
# everybody building on 25.
#
# A toolchain rather than `jvmTarget` alone: `jvmTarget` asks for older bytecode while still compiling
# against the newest JDK's class library, so a call to something added in 21 compiles and then fails
# on a 17 runtime. A toolchain compiles against 17's API, which turns "we use nothing newer" from an
# assumption into something the build checks.
#
# Both numbers at once is a Gradle requirement rather than tidiness: where `org.gradle.jvm.version` is
# present, a module on 17 cannot be built against a dependency on 25 — so it is all of them or none.
sborka.jvmToolchain=17
sborka.jvmFloor=17

# PREFER_SETTINGS rather than the default refusal, and it is the `wasmJs` target that decides it: the
# Kotlin plugin registers ivy repositories for the Node and Yarn distributions ON THE PROJECT, and
# FAIL_ON_PROJECT_REPOS then refuses the build over a repository nobody in it wrote, with "added by
# unknown code". Settings repositories still win; the mode just stops shouting.
sborka.repositoriesMode=PREFER_SETTINGS


# ON, FOR EVERY MODULE. The right setting for a toolkit whose every module is published: a
# declaration reaches a consumer because somebody wrote `public`, not because nobody wrote anything.
#
# It was off through the migration to these conventions, because switching it on stopped the build
# with 871 findings and a diff that size would have buried whatever the migration itself broke. It
# came back module by module (youndie/kompot#101), reading each surface rather than sweeping
# `public` across it — which is how four declarations turned out to be nobody's business and became
# `internal` instead.
sborka.explicitApi=true
