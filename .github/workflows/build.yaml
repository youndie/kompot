name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Linux builds both the JVM variants and the iOS klibs. What it does NOT cover is tests on an
    # iOS simulator: those need macOS with a simulator runtime installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build --no-daemon
