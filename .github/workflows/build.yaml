name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Linux builds both the JVM variants and the iOS klibs. What it does NOT cover is tests on an
    # iOS simulator: those need macOS with a simulator runtime installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Java and Gradle in one step and at one version for the portfolio. The JDK here is what
      # GRADLE runs on; what the modules compile to is `sborka.jvmToolchain=17`, fetched by the
      # toolchain resolver.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      - run: ./gradlew build --no-daemon

      # Both audits below read real published metadata, which is why they publish locally first, and
      # both exist because the defect they look for is invisible to the build itself: everything
      # compiles, tests and publishes green, and only a consumer finds out.
      #
      # A module whose public API is declared `implementation` tells a consumer it needs nothing.
      # An artifact whose file name is built from a different version than its coordinate arrives
      # under a name no release ever had. Bytecode newer than the floor resolves, compiles, and then
      # fails in the consumer's runtime — and every machine this is built on is too new to see it.
      - name: Published metadata is complete, correctly named and within the JVM floor
        run: |
          ./gradlew publishToMavenLocal -PVERSION=ci-${{ github.run_number }} --no-daemon
          python3 tools/api-metadata-audit.py ci-${{ github.run_number }}
          python3 tools/artifact-name-audit.py ci-${{ github.run_number }}
          python3 tools/jvm-floor-audit.py ci-${{ github.run_number }}
