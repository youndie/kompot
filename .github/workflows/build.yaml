name: Build

# `push` on main as well, and not only `pull_request`. A green pull request was checked on its own
# base; what lands on main is a different tree, and nothing here ever built the merge commit. Two
# branches can each be green against the base they were cut from and disagree once both are in.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Linux builds both the JVM variants and the iOS klibs. What it does NOT cover is tests on an
    # iOS simulator: those need macOS with a simulator runtime installed.
    runs-on: ubuntu-latest
    steps:
      # The whole history, not the one commit: the schema compatibility check below compares this
      # tree with the revision the branch was cut from, and `git merge-base` has nothing to answer
      # with in a shallow clone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Java and Gradle in one step and at one version for the portfolio. The JDK here is what
      # GRADLE runs on; what the modules compile to is `sborka.jvmToolchain=17`, fetched by the
      # toolchain resolver.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
      - run: ./gradlew build --no-daemon

      # §15 of the spec says which change of the schema is compatible and which is not, and until now
      # the diff of schema/*.json in the pull request was the whole mechanism. That diff is exactly
      # where the two cases it matters most to tell apart look the same: a new component and a new
      # form field are both a block of JSON under $defs and a line in a mapping, while the first
      # degrades to a placeholder on an old client and the second costs it the whole response (§2.2).
      #
      # The base is the revision the branch was cut from — the pull request's base, or the previous
      # head of main on a push — rather than the branch name, so that a merge by somebody else can
      # neither turn this red nor turn it green.
      - name: The change of the schema is compatible under SPEC.md §15
        run: ./gradlew :kompot-spec:checkSchemaCompatibility -Pkompot.compat.base=$BASE --no-daemon
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}

      # Both audits below read real published metadata, which is why they publish locally first, and
      # both exist because the defect they look for is invisible to the build itself: everything
      # compiles, tests and publishes green, and only a consumer finds out.
      #
      # A module whose public API is declared `implementation` tells a consumer it needs nothing.
      # An artifact whose file name is built from a different version than its coordinate arrives
      # under a name no release ever had. Bytecode newer than the floor resolves, compiles, and then
      # fails in the consumer's runtime — and every machine this is built on is too new to see it.
      - name: Published metadata is complete, correctly named and within the JVM floor
        run: |
          ./gradlew publishToMavenLocal -PVERSION=ci-${{ github.run_number }} --no-daemon
          python3 tools/api-metadata-audit.py ci-${{ github.run_number }}
          python3 tools/artifact-name-audit.py ci-${{ github.run_number }}
          python3 tools/jvm-floor-audit.py ci-${{ github.run_number }}
