name: Publish kompot snapshots

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  publish:
    outputs:
      version: ${{ steps.ver.outputs.version }}
    # Linux rather than macOS: Kotlin/Native cross-compiles klibs for the Apple targets here too —
    # verified by running compileKotlinIosArm64 on Linux. macOS is needed only to link a finished
    # framework and to run simulator tests, and a library publishes neither.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # The run number goes on the tail of the version: two publishes in a row must not produce
      # the same artifact, or a consumer cannot tell them apart and keeps the cached older one.
      - name: Determine version
        id: ver
        run: |
          VERSION=$(grep kompot.version gradle.properties | cut -d'=' -f2).${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and publish
        run: ./gradlew build publishAllPublicationsToWipRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
          ORG_GRADLE_PROJECT_VERSION: ${{ steps.ver.outputs.version }}

  # What a consumer receives, read from the repository after the upload rather than from a build
  # directory before it. The three audits on the PR build read a LOCAL publication, which is the same
  # bytes but not the same event: a file that failed to upload, a coordinate that resolves to the
  # previous version, a redirector pointing at a target that never arrived — none of that exists until
  # something asks the repository, and none of it fails a publish.
  #
  # A separate job so that a finding here cannot be mistaken for a publish that did not happen: by the
  # time this runs the artefacts are up, and what is red is the report about them.
  consumer:
    needs: publish
    runs-on: ubuntu-latest
    # Only the badge branch is written, and only by the step below.
    permissions:
      contents: write
    steps:
      # Pinned, and not for the usual reason. `@main` stopped loading entirely — its action.yml
      # carries a replacement character after one input's default, so GitHub fails the job at
      # "Set up job" and nothing is checked at all (youndie/proba#10).
      #
      # ef9b687 is the last commit whose manifest parses. It is BEFORE two things: the badge file
      # (so `badge-dir` does not exist here and no badge is written) and the fix that reads the
      # surface a consumer can write (so kompot-client reports types only its generated resource
      # accessor names, and is checked below where it cannot fail the job).
      #
      # Both come back together: unpin, restore badge-dir, and put kompot-client back in this list.
      - name: What a consumer gets
        uses: youndie/proba@ef9b6871cdbf27904067dee3c583bf2f8364148c
        with:
          # The coordinates a consumer starts from: the platform that pins the set, the protocol every
          # implementation compiles against, and the two clients. Not all thirty-four — the cost is a
          # real consumer build per coordinate, and a defect in this build reaches all of them the same
          # way.
          coordinate: |
            io.github.youndie:kompot-bom:${{ needs.publish.outputs.version }}
            io.github.youndie:kompot-core:${{ needs.publish.outputs.version }}
            io.github.youndie:kompot-standard:${{ needs.publish.outputs.version }}
            io.github.youndie:kompot-client-tck:${{ needs.publish.outputs.version }}
          repository: https://reposilite.kotlin.website/snapshots
          # The confirming tier. `implementation` is right exactly when no public signature mentions
          # the dependency, and only a build that compiles against the publication can tell those apart
          # — the metadata cannot, and neither can the audit in this repository, which reads sources.
          deep: "true"
          # A defect fails; a suspicion does not, because a suspicion is a shape rather than a verdict.
          # An undetermined never fails anything anywhere: a check that could not run turned red is how
          # people learn to switch the answers off along with the noise.
          fail-on: defect
          # No badge-dir: this pin predates it. The step below stays, and says so rather than
          # failing, so that unpinning is one line and not an archaeology exercise.

      # The badges live on a branch of their own, holding nothing else and keeping no history: they
      # are output, not source. Committing them to main would put a machine-written file in the log
      # of every release and make every publish a change to the tree it was built from.
      #
      # Force-pushed a single commit each time for the same reason — nobody diffs yesterday's badge,
      # and a branch that only grows is a cost with no reader.
      - name: What a consumer gets — kompot-client, advisory
        uses: youndie/proba@ef9b6871cdbf27904067dee3c583bf2f8364148c
        with:
          coordinate: io.github.youndie:kompot-client:${{ needs.publish.outputs.version }}
          repository: https://reposilite.kotlin.website/snapshots
          deep: "true"
          fail-on: none

      - name: Publish the badges
        # Also when the check failed, and especially then: the badge's whole job is to say "2
        # defects" out loud. Skipping it on failure would leave the last clean picture standing over
        # a release that is not, which is worse than having no badge at all.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Absent while the checker is pinned to a commit that cannot write them. Not a failure:
          # the badge is a picture of the check, and the check itself ran in the step above.
          if [ ! -d badges ] || ! ls badges/*.svg >/dev/null 2>&1; then
            echo "no badges were written — the pinned checker does not write them (youndie/proba#10)"
            exit 0
          fi
          cd badges
          git init -q -b badges .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c commit.gpgsign=false commit -q -m "chore: badges for ${{ needs.publish.outputs.version }}"
          git push -q --force "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" badges

